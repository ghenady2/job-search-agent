name: IT PM Job Search

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run search
        run: python search_jobs.py
      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: job-search-results
          path: output/
          retention-days: 14
      - name: Commit updated results and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ data/seen_jobs.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update job search results"
            git push
          fi
